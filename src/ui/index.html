<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17212c">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Grind Strat: a slow, deep grand strategy game of the Baltic lands, from the first hunters to today.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grind Strat">
<title>Grind Strat</title>
<link rel="icon" type="image/png" href="{{ICON}}">
<style>{{CSS}}</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="row1">
      <h1 class="brand">Grind Strat</h1>
      <div class="date" id="date"></div>
    </div>
    <div class="speed" role="group" aria-label="Game speed">
      <button type="button" data-speed="0" aria-label="Pause"><svg viewBox="0 0 12 14" width="12" height="14" aria-hidden="true"><rect x="1" y="1" width="3.4" height="12" rx="1"/><rect x="7.6" y="1" width="3.4" height="12" rx="1"/></svg></button>
      <button type="button" data-speed="1" aria-label="Speed 1, slowest">1</button>
      <button type="button" data-speed="2" aria-label="Speed 2">2</button>
      <button type="button" data-speed="3" aria-label="Speed 3">3</button>
      <button type="button" data-speed="4" aria-label="Speed 4">4</button>
      <button type="button" data-speed="5" aria-label="Speed 5, fastest">5</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="map" role="img" aria-label="The map. Drag to move, pinch or use the mouse wheel to zoom."></canvas>
    <div class="map-tools">
      <button type="button" class="chip" data-act="credits">Credits</button>
      <button type="button" class="chip" data-act="speedtest">Speed test</button>
    </div>
    <button type="button" class="map-credit" data-act="credits" id="mapCredit"><span id="mapCreditText"></span></button>
    <section class="sheet" id="speedSheet" hidden aria-labelledby="speedTitle">
      <div class="sheet-head">
        <h2 id="speedTitle">Speed test</h2>
        <button type="button" class="btn" data-act="close-speed">Close</button>
      </div>
      <pre class="results" id="speedResults"></pre>
      <div class="row-btns">
        <button type="button" class="btn primary" data-act="copy-speed">Copy</button>
        <button type="button" class="btn" data-act="rerun-speed">Run again</button>
      </div>
    </section>
    <section class="sheet" id="creditsSheet" hidden aria-labelledby="creditsTitle">
      <div class="sheet-head">
        <h2 id="creditsTitle">Credits</h2>
        <button type="button" class="btn" data-act="close-credits">Close</button>
      </div>
      <div class="credits" id="creditsBody"></div>
    </section>
  </main>
  <footer class="bar">
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="actions">
      <button type="button" class="btn" data-act="save">Save</button>
      <button type="button" class="btn" data-act="load">Load</button>
      <button type="button" class="btn" data-act="new">New game</button>
      <button type="button" class="btn primary" data-act="install" hidden>Install</button>
    </div>
  </footer>
</div>
{{DATA}}
<script>{{SCRIPT}}</script>
</body>
</html>
