# Checks, tests and builds the game on every pull request and every push to main.
# Pushes to main also publish dist/ to GitHub Pages, so the game opens and installs on a phone at
# https://syncronizator1995-droid.github.io/grind-strat/
# One-time setup in the repo: Settings > Pages > Source: "GitHub Actions" (the repo must be public).
name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run soak
      - run: npx playwright install --with-deps chromium
      - run: npm run shots
      - name: Keep the phone screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phone-screenshots
          path: shots/
          if-no-files-found: ignore
      - name: Package the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  publish:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
